name: lint

on:
  push:
    branches: [main]
  pull_request:

env:
  SHFMT_VERSION: v3.13.1

jobs:
  shell:
    name: shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shfmt
        run: |
          curl -fsSL -o /tmp/shfmt \
            "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          chmod +x /tmp/shfmt
          sudo mv /tmp/shfmt /usr/local/bin/shfmt

      - name: Collect shell scripts
        run: |
          shfmt -f src/scripts/setup src/scripts/global src/conf/starship \
            | tee scripts.txt
          test -s scripts.txt

      - name: shellcheck
        run: xargs shellcheck -x <scripts.txt

      - name: shfmt
        run: xargs shfmt -d -i 2 -ci <scripts.txt

  # The job above runs everything under bash 5, where this repo's own setup
  # scripts are never run for the first time. A fresh Mac has bash 3.2.57 at
  # /bin/bash and nothing newer — the Brewfile's bash is installed by the very
  # script in question, and setup-zsh.sh runs over curl before Homebrew exists
  # at all — and 3.2 rejects constructs bash 5 accepts. Those are parse errors,
  # so they take the whole script down before its first line of output.
  #
  # The Linux scripts are held to the same version even though every Linux has
  # bash 5, because they share lib/ with the macOS ones and a 3.2-hostile
  # construct added there would only surface on a Mac.
  bash32:
    name: bash 3.2 and zsh
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shfmt
        run: |
          case "$(uname -m)" in
            arm64) arch=arm64 ;;
            *) arch=amd64 ;;
          esac
          curl -fsSL -o /tmp/shfmt \
            "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_darwin_${arch}"
          chmod +x /tmp/shfmt
          sudo mv /tmp/shfmt /usr/local/bin/shfmt

      - name: Collect shell scripts
        run: |
          shfmt -f src/scripts/setup src/scripts/global src/conf/starship \
            | tee scripts.txt
          test -s scripts.txt

      - name: Parse with the system bash
        run: |
          /bin/bash --version | head -1
          xargs -n1 /bin/bash -n <scripts.txt

      # src/conf/zsh is sourced by zsh but promises to stay valid in bash; see
      # src/conf/zsh/README.md.
      - name: Parse the shell config in both shells
        run: |
          for f in src/conf/zsh/*.zsh; do
            /bin/bash -n "$f"
            zsh -n "$f"
          done
