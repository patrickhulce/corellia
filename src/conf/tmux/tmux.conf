# tmux reads the outer terminal's terminfo to decode keys. Ghostty sends DEL
# (^?) for backspace (kbs=\177), but xterm-256color says kbs=^H. When
# 21-term.zsh falls back to xterm-256color, tmux would otherwise translate
# backspace as a cursor-left with no delete. See src/conf/zsh/21-term.zsh.
set -as terminal-overrides ',xterm-256color:kbs@:kbs=\177'
